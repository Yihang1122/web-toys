<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专注冲刺 Focus Sprint</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #f4f5fa;
    --accent: #7c83fd;
    --accent2: #5ee7df;
    --text: #2a2c4e;
    --muted: #767a9c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
  }
  .ring-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto 28px;
  }
  canvas {
    width: 100%;
    height: 100%;
  }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .time {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .mode {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
  }
  button {
    border: none;
    border-radius: 14px;
    padding: 12px 22px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  .primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #11122a;
  }
  .secondary {
    background: rgba(0,0,0,0.06);
    color: var(--text);
  }
  .secondary:hover { background: rgba(0,0,0,0.1); }
  .stats {
    display: flex;
    justify-content: space-around;
    border-top: 1px solid rgba(0,0,0,0.08);
    padding-top: 20px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat .num {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent2);
  }
  .stat .label {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .modes {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .mode-btn {
    background: rgba(0,0,0,0.04);
    color: var(--muted);
    padding: 8px 16px;
    font-size: 0.8rem;
    border-radius: 10px;
  }
  .mode-btn.active {
    background: rgba(124,131,253,0.2);
    color: var(--accent2);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>专注冲刺 🍉</h1>
    <p class="subtitle">保持专注，逐个击破</p>

    <div class="modes">
      <button class="mode-btn active" data-minutes="25" data-mode="专注">专注 25</button>
      <button class="mode-btn" data-minutes="5" data-mode="短休息">短休息 5</button>
      <button class="mode-btn" data-minutes="15" data-mode="长休息">长休息 15</button>
    </div>

    <div class="ring-wrap">
      <canvas id="ring" width="260" height="260"></canvas>
      <div class="ring-center">
        <div class="time" id="time">25:00</div>
        <div class="mode" id="modeLabel">专注</div>
      </div>
    </div>

    <div class="controls">
      <button class="secondary" id="resetBtn">重置</button>
      <button class="primary" id="startBtn">开始</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="num" id="streak">0</div>
        <div class="label">连续打卡天数</div>
      </div>
      <div class="stat">
        <div class="num" id="today">0</div>
        <div class="label">今日完成次数</div>
      </div>
      <div class="stat">
        <div class="num" id="total">0</div>
        <div class="label">累计完成次数</div>
      </div>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('ring');
  const ctx = canvas.getContext('2d');
  const timeEl = document.getElementById('time');
  const modeLabel = document.getElementById('modeLabel');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const modeBtns = document.querySelectorAll('.mode-btn');
  const streakEl = document.getElementById('streak');
  const todayEl = document.getElementById('today');
  const totalEl = document.getElementById('total');

  const STORAGE_KEY = 'focusSprintData';

  let totalSeconds = 25 * 60;
  let remaining = totalSeconds;
  let running = false;
  let timer = null;
  let currentMode = '专注';

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { lastDate: null, streak: 0, todayCount: 0, total: 0 };
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function refreshStats() {
    const data = loadData();
    const today = todayStr();
    if (data.lastDate !== today) {
      data.todayCount = 0;
    }
    streakEl.textContent = data.streak || 0;
    todayEl.textContent = data.todayCount || 0;
    totalEl.textContent = data.total || 0;
  }

  function recordCompletion() {
    const data = loadData();
    const today = todayStr();

    if (data.lastDate === today) {
      data.todayCount = (data.todayCount || 0) + 1;
    } else {
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yStr = yesterday.getFullYear() + '-' + (yesterday.getMonth() + 1) + '-' + yesterday.getDate();
      if (data.lastDate === yStr) {
        data.streak = (data.streak || 0) + 1;
      } else {
        data.streak = 1;
      }
      data.todayCount = 1;
      data.lastDate = today;
    }
    data.total = (data.total || 0) + 1;
    saveData(data);
    refreshStats();
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  function drawRing() {
    const size = canvas.width;
    const cx = size / 2;
    const cy = size / 2;
    const radius = size / 2 - 14;
    const progress = 1 - remaining / totalSeconds;

    ctx.clearRect(0, 0, size, size);

    // background ring
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.07)';
    ctx.lineWidth = 14;
    ctx.stroke();

    // progress ring
    const startAngle = -Math.PI / 2;
    const endAngle = startAngle + Math.PI * 2 * progress;
    const gradient = ctx.createLinearGradient(0, 0, size, size);
    gradient.addColorStop(0, '#7c83fd');
    gradient.addColorStop(1, '#5ee7df');

    ctx.beginPath();
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.strokeStyle = gradient;
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function updateDisplay() {
    timeEl.textContent = formatTime(remaining);
    modeLabel.textContent = currentMode;
    drawRing();
  }

  function playChime() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioCtx();
      const notes = [880, 1108, 1318];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + i * 0.18);
        gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + i * 0.18 + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + i * 0.18 + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.18);
        osc.stop(audioCtx.currentTime + i * 0.18 + 0.5);
      });
    } catch (e) {}
  }

  function tick() {
    if (remaining > 0) {
      remaining -= 1;
      updateDisplay();
    }
    if (remaining <= 0) {
      stop();
      playChime();
      if (currentMode === '专注') {
        recordCompletion();
      }
      startBtn.textContent = '开始';
    }
  }

  function start() {
    if (running) return;
    running = true;
    startBtn.textContent = '暂停';
    timer = setInterval(tick, 1000);
  }

  function stop() {
    running = false;
    clearInterval(timer);
    timer = null;
    startBtn.textContent = '开始';
  }

  function reset() {
    stop();
    remaining = totalSeconds;
    updateDisplay();
  }

  startBtn.addEventListener('click', () => {
    if (running) {
      stop();
    } else {
      start();
    }
  });

  resetBtn.addEventListener('click', reset);

  modeBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      modeBtns.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      const minutes = parseInt(btn.dataset.minutes, 10);
      currentMode = btn.dataset.mode;
      totalSeconds = minutes * 60;
      reset();
    });
  });

  refreshStats();
  updateDisplay();
})();
</script>
</body>
</html>
